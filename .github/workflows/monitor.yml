name: 📊 Monitor de Portfólio

on:
  schedule:
    # Roda a cada hora, dias úteis, das 9h às 22h UTC
    # = 6h às 19h (hora de Brasília)
    # Cobre abertura da B3 (10h BRL) e NYSE (9:30h ET) até o fechamento
    - cron: '0 9-22 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Rodar em modo debug?'
        required: false
        default: 'false'

jobs:
  monitor:
    name: Analisar e alertar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🔍 Rodar monitoramento
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python monitor.py

      - name: 💾 Publicar prices.json
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add prices.json
          git diff --staged --quiet || git commit -m "chore: update prices.json [skip ci]"
          git push

      - name: 📋 Log de conclusão
        if: always()
        run: echo "Monitor finalizado em $(date -u '+%Y-%m-%d %H:%M UTC')"
