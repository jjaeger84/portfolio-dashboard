name: 📊 Monitor de Portfólio

on:
  schedule:
    # Roda a cada hora, dias úteis, das 12h às 22h UTC
    # = 9h às 19h (hora de Brasília) / 8h às 18h (ET)
    # Cobre abertura da B3 (10h BRL) e NYSE (10h ET) até o fechamento
    - cron: '0 12-22 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Rodar em modo debug?'
        required: false
        default: 'false'

jobs:
  monitor:
    name: Analisar e alertar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🔍 Rodar monitoramento
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python monitor.py

      - name: 📋 Log de conclusão
        if: always()
        run: echo "Monitor finalizado em $(date -u '+%Y-%m-%d %H:%M UTC')"
